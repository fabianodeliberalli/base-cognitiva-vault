<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#ebe4d5"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".16"/></filter><style>.t{font:700 58px Georgia;fill:#173b38}.s{font:27px Arial;fill:#59645f}.h{font:700 31px Arial;fill:#173b38;text-anchor:middle}.p{font:24px Arial;fill:#4f5955;text-anchor:middle}.w{font:24px Arial;fill:#fff;text-anchor:middle}</style></defs><rect width="1800" height="1800" fill="url(#bg)"/><text x="900" y="100" class="t" text-anchor="middle">MANDALA • LABIRINTO • EIXO</text><text x="900" y="150" class="s" text-anchor="middle">Três imagens complementares para organização, percurso e orientação</text><rect x="90" y="245" width="500" height="1100" rx="65" fill="#e6dff0" stroke="#fff" stroke-width="8" filter="url(#sh)"/><text x="340" y="325" class="h">MANDALA</text><text x="340" y="370" class="p">cartografia espacial do campo</text><circle cx="340" cy="745" r="260" fill="none" stroke="#6f5188" stroke-width="16"/><circle cx="340" cy="745" r="180" fill="none" stroke="#b98a38" stroke-width="10"/><circle cx="340" cy="745" r="95" fill="#e5c56e" stroke="#fff" stroke-width="8"/><path d="M340 485V1005M80 745H600M156 561L524 929M524 561L156 929" stroke="#6f5188" stroke-width="7" opacity=".5"/><text x="340" y="1110" class="p">centro • relações • polaridades</text><text x="340" y="1150" class="p">imagem atual da organização</text><text x="340" y="1190" class="p">expressão livre, não diagnóstica</text><rect x="650" y="245" width="500" height="1100" rx="65" fill="#dae9d2" stroke="#fff" stroke-width="8" filter="url(#sh)"/><text x="900" y="325" class="h">LABIRINTO</text><text x="900" y="370" class="p">percurso temporal e recursivo</text><path d="M900 1060C650 1060 700 650 900 650C1080 650 1080 920 900 920C770 920 780 745 900 745C985 745 990 850 910 850C865 850 865 800 900 800" fill="none" stroke="#487161" stroke-width="22" stroke-linecap="round"/><path d="M900 510C1210 510 1280 1175 900 1190C520 1205 420 430 900 430" fill="none" stroke="#98ae76" stroke-width="17" stroke-linecap="round"/><circle cx="900" cy="800" r="28" fill="#b8872b"/><text x="900" y="1110" class="p">aproximação • afastamento • retorno</text><text x="900" y="1150" class="p">recorrência com novos recursos</text><text x="900" y="1190" class="p">o centro não é fuga da vida</text><rect x="1210" y="245" width="500" height="1100" rx="65" fill="#d8ece6" stroke="#fff" stroke-width="8" filter="url(#sh)"/><text x="1460" y="325" class="h">EIXO</text><text x="1460" y="370" class="p">orientação, presença e retorno</text><path d="M1460 475C1375 620 1535 720 1425 875C1365 960 1450 1035 1460 1110" fill="none" stroke="#b8872b" stroke-width="30" stroke-linecap="round"/><circle cx="1460" cy="790" r="120" fill="#e5c56e" stroke="#fff" stroke-width="9"/><text x="1460" y="780" class="h">EIXO</text><text x="1460" y="825" class="p">reencontrar</text><text x="1460" y="1110" class="p">não é um ponto fixo</text><text x="1460" y="1150" class="p">nem estabilidade permanente</text><text x="1460" y="1190" class="p">é capacidade progressiva</text><rect x="180" y="1450" width="1440" height="185" rx="75" fill="#173b38"/><text x="900" y="1510" class="h" fill="#fff">MOVIMENTO INTEGRAL</text><text x="900" y="1560" class="w">aprofundar-se para dentro • abrir-se para o alto • retornar para fora</text><text x="900" y="1600" class="w">em direção ao corpo, às relações, às escolhas e à vida</text><text x="900" y="1710" class="p">Metáforas candidatas: abrem investigação e não determinam a interpretação da experiência.</text></svg>
