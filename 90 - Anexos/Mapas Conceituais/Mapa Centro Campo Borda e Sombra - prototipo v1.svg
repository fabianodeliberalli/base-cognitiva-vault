<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800"><defs><radialGradient id="bg"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#e9e2d4"/></radialGradient><radialGradient id="field"><stop stop-color="#f6df9b"/><stop offset=".42" stop-color="#d8ece6"/><stop offset="1" stop-color="#d8e2f0"/></radialGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".17"/></filter><style>.t{font:700 55px Georgia;fill:#173a39}.s{font:27px Arial;fill:#53645f}.h{font:700 30px Arial;fill:#173a39;text-anchor:middle}.p{font:24px Arial;fill:#46544f;text-anchor:middle}.w{font:24px Arial;fill:#fff;text-anchor:middle}.tag{font:700 22px Arial;fill:#fff;text-anchor:middle}</style></defs><rect width="1800" height="1800" fill="url(#bg)"/><text x="900" y="95" class="t" text-anchor="middle">CENTRO • CAMPO • BORDA • SOMBRA</text><text x="900" y="145" class="s" text-anchor="middle">Uma cartografia da experiência multidimensional — síntese autoral em diálogo com Jung</text><circle cx="900" cy="875" r="610" fill="url(#field)" stroke="#fff" stroke-width="14" filter="url(#sh)"/><circle cx="900" cy="875" r="610" fill="none" stroke="#315f5a" stroke-width="28"/><path d="M525 420C665 325 750 490 860 500C1010 515 1070 330 1250 430C1390 510 1270 650 1305 770C1345 910 1515 965 1350 1115C1225 1230 1085 1135 1000 1235C895 1355 760 1470 630 1300C520 1155 645 1040 545 950C410 830 350 540 525 420Z" fill="#5b496c" opacity=".26"/><path d="M610 600C720 500 790 650 895 615M1070 570C1185 680 1070 775 1195 850M610 1080C730 980 800 1130 900 1090M1040 1180C1140 1060 1240 1190 1310 1090" fill="none" stroke="#624778" stroke-width="30" stroke-linecap="round" opacity=".6"/><circle cx="900" cy="875" r="190" fill="#c99735" stroke="#fff5d0" stroke-width="12" filter="url(#sh)"/><path d="M900 755C865 800 845 850 860 900C875 950 920 990 900 1040C940 985 955 935 940 885C925 835 885 805 900 755Z" fill="#fff4ce" opacity=".9"/><text x="900" y="855" class="h">EIXO</text><text x="900" y="900" class="p">orientação • presença</text><text x="900" y="935" class="p">capacidade de retorno</text><g><rect x="75" y="380" width="345" height="205" rx="40" fill="#315f5a"/><text x="247" y="440" class="tag">CENTRO POSSÍVEL</text><text x="247" y="485" class="w">Self • totalidade</text><text x="247" y="520" class="w">sentido • orientação</text><path d="M420 510L710 720" stroke="#315f5a" stroke-width="7"/></g><g><rect x="1380" y="360" width="345" height="235" rx="40" fill="#567b78"/><text x="1552" y="420" class="tag">CAMPO</text><text x="1552" y="465" class="w">corpo • afetos • memórias</text><text x="1552" y="500" class="w">imagens • relações • energia</text><text x="1552" y="535" class="w">feridas • recursos • potências</text><path d="M1380 520L1220 650" stroke="#567b78" stroke-width="7"/></g><g><rect x="80" y="1210" width="355" height="230" rx="40" fill="#624778"/><text x="257" y="1270" class="tag">SOMBRA</text><text x="257" y="1315" class="w">atravessa partes do campo</text><text x="257" y="1350" class="w">desconhecido • reprimido</text><text x="257" y="1385" class="w">ferido • projetado • não vivido</text><path d="M435 1280L620 1120" stroke="#624778" stroke-width="7"/></g><g><rect x="1370" y="1195" width="355" height="245" rx="40" fill="#355b73"/><text x="1547" y="1255" class="tag">BORDA / INTERFACE</text><text x="1547" y="1300" class="w">persona • limites • contato</text><text x="1547" y="1335" class="w">relação • expressão</text><text x="1547" y="1370" class="w">encontro com o mundo</text><path d="M1370 1280L1290 1180" stroke="#355b73" stroke-width="7"/></g><path d="M655 1550C780 1640 1020 1640 1145 1550" fill="none" stroke="#b8872b" stroke-width="10"/><path d="M1130 1530L1150 1550L1128 1570" fill="none" stroke="#b8872b" stroke-width="10"/><text x="900" y="1510" class="h">TRADUÇÃO → INTEGRAÇÃO → REORGANIZAÇÃO → EIXO</text><text x="900" y="1690" class="p">A sombra não é todo o campo. Integrar não é eliminar: é reconhecer, diferenciar, elaborar e reorganizar.</text></svg>
