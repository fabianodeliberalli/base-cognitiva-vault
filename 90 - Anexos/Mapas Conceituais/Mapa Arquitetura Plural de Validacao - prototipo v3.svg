<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#ebe5d8"/></linearGradient><style>.t{font:700 55px Georgia;fill:#173b38}.s{font:27px Arial;fill:#59645f}.h{font:700 27px Arial;fill:#173b38;text-anchor:middle}.l{font:700 20px Arial;fill:#173b38;text-anchor:middle}.w{font:700 20px Arial;fill:#fff;text-anchor:middle}.p{font:22px Arial;fill:#4f5955;text-anchor:middle}</style></defs><rect width="1800" height="1800" fill="url(#bg)"/><text x="900" y="95" class="t" text-anchor="middle">ARQUITETURA PLURAL DE VALIDAÇÃO</text><text x="900" y="145" class="s" text-anchor="middle">Articulação responsável entre regimes — sem redução nem tribunal único</text><text x="250" y="235" class="h">DOMÍNIOS</text><text x="1550" y="235" class="h">ESTATUTOS</text><g><rect x="70" y="275" width="360" height="86" rx="35" fill="#d8ece6"/><rect x="70" y="382" width="360" height="86" rx="35" fill="#dce8ce"/><rect x="70" y="489" width="360" height="86" rx="35" fill="#e7dcf3"/><rect x="70" y="596" width="360" height="86" rx="35" fill="#f1e0b5"/><rect x="70" y="703" width="360" height="86" rx="35" fill="#d8e2f0"/><rect x="70" y="810" width="360" height="86" rx="35" fill="#ead9c8"/><rect x="70" y="917" width="360" height="86" rx="35" fill="#d5e8df"/><rect x="70" y="1024" width="360" height="86" rx="35" fill="#efd9b8"/><rect x="70" y="1131" width="360" height="86" rx="35" fill="#e6dff0"/></g><g class="l"><text x="250" y="328">FENOMENOLÓGICO</text><text x="250" y="435">CLÍNICO-PRAGMÁTICO</text><text x="250" y="542">INTERSUBJETIVO</text><text x="250" y="649">SIMBÓLICO</text><text x="250" y="756">TRADICIONAL</text><text x="250" y="863">FILOSÓFICO-EXISTENCIAL</text><text x="250" y="970">ÉTICO</text><text x="250" y="1077">CIENTÍFICO</text><text x="250" y="1184">ESPIRITUAL</text></g><g><rect x="1340" y="275" width="390" height="86" rx="35" fill="#315f5a"/><rect x="1340" y="382" width="390" height="86" rx="35" fill="#3f706a"/><rect x="1340" y="489" width="390" height="86" rx="35" fill="#587f78"/><rect x="1340" y="596" width="390" height="86" rx="35" fill="#6f5188"/><rect x="1340" y="703" width="390" height="86" rx="35" fill="#7b6637"/><rect x="1340" y="810" width="390" height="86" rx="35" fill="#355b73"/><rect x="1340" y="917" width="390" height="86" rx="35" fill="#6b5c4c"/><rect x="1340" y="1024" width="390" height="86" rx="35" fill="#536f3f"/><rect x="1340" y="1131" width="390" height="86" rx="35" fill="#76518d"/></g><g class="w"><text x="1535" y="328">EXPERIÊNCIA VIVIDA</text><text x="1535" y="435">OBSERVAÇÃO CLÍNICA</text><text x="1535" y="542">RECURSO PEDAGÓGICO</text><text x="1535" y="649">SÍMBOLO / METÁFORA</text><text x="1535" y="756">ENSINAMENTO TRADICIONAL</text><text x="1535" y="863">HIPÓTESE EXPLICATIVA</text><text x="1535" y="970">CORRELAÇÃO CIENTÍFICA</text><text x="1535" y="1077">PROPOSIÇÃO FILOSÓFICA</text><text x="1535" y="1184">HORIZONTE ESPIRITUAL</text></g><path d="M430 745H635M1165 745H1340" stroke="#b8872b" stroke-width="12"/><circle cx="900" cy="745" r="270" fill="#173b38"/><text x="900" y="690" class="w" font-size="30">TRADUÇÃO E ARTICULAÇÃO</text><text x="900" y="755" font-family="Arial" font-size="24" fill="#e6eee9" text-anchor="middle">O que este mapa revela?</text><text x="900" y="800" font-family="Arial" font-size="24" fill="#e6eee9" text-anchor="middle">O que deixa de fora?</text><text x="900" y="845" font-family="Arial" font-size="24" fill="#e6eee9" text-anchor="middle">O que pode sustentar?</text><rect x="150" y="1370" width="1500" height="230" rx="75" fill="#173b38"/><text x="900" y="1435" class="w" font-size="27">CONVIVÊNCIA COM CRITÉRIOS</text><text x="900" y="1490" font-family="Arial" font-size="23" fill="#e6eee9" text-anchor="middle">Nenhuma linguagem coloniza as demais. Pluralidade não elimina discernimento.</text><text x="900" y="1535" font-family="Arial" font-size="23" fill="#e6eee9" text-anchor="middle">Toda afirmação declara de onde fala, o que pode sustentar e quais são seus limites.</text><text x="900" y="1700" class="p">Pluralismo epistemológico não redutivo.</text></svg>
