<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Mapa Pêndulo, Espiral e Percurso</title><desc id="d">À esquerda, um pêndulo representa a oscilação do estado e do acesso. À direita, uma espiral representa o percurso e os reencontros. Uma linha central representa a referência e o EIXO favorece retorno e direção.</desc>
<defs><style>
.title{font:700 48px Georgia,serif;fill:#F4EFEA}.sub{font:400 24px Arial,sans-serif;fill:#DDE7E3}
.h{font:700 27px Arial,sans-serif;fill:#F4EFEA}.b{font:400 22px Arial,sans-serif;fill:#F4EFEA}
.small{font:400 18px Arial,sans-serif;fill:#DDE7E3}.label{font:700 20px Arial,sans-serif;letter-spacing:2px;fill:#C9D8D1}
</style><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter></defs><rect width="1600" height="900" rx="28" fill="#173F52"/><rect x="42" y="42" width="1516" height="816" rx="24" fill="none" stroke="#7E9E84" stroke-width="2"/>
<text x="80" y="110" class="title">Pêndulo, Espiral e Percurso</text><text x="80" y="150" class="sub">Por que nem sempre nossas capacidades ficam mais acessíveis ao longo da experiência</text>
<line x1="800" y1="215" x2="800" y2="710" stroke="#F4EFEA" stroke-width="3" stroke-dasharray="8 12"/><text x="800" y="198" text-anchor="middle" class="label">REFERÊNCIA</text>
<path d="M245 300 Q455 665 665 300" fill="none" stroke="#7E9E84" stroke-width="3"/><line x1="455" y1="300" x2="300" y2="560" stroke="#C99A64" stroke-width="5"/><circle cx="300" cy="560" r="32" fill="#C99A64" filter="url(#shadow)"/>
<circle cx="455" cy="300" r="12" fill="#F4EFEA"/><text x="455" y="255" text-anchor="middle" class="h">Pêndulo</text><text x="455" y="650" text-anchor="middle" class="b">estado e acesso oscilam</text><text x="455" y="683" text-anchor="middle" class="small">movimento vivido · condições atuais</text>
<path d="M1040 610 C850 520 900 300 1110 300 C1360 300 1410 610 1180 665 C960 720 840 540 930 405 C1010 285 1220 340 1240 475 C1260 590 1090 625 1030 530 C980 455 1060 385 1135 425 C1195 457 1160 525 1115 507" fill="none" stroke="#7E9E84" stroke-width="9" stroke-linecap="round"/>
<circle cx="1115" cy="507" r="14" fill="#C99A64"/><text x="1160" y="255" text-anchor="middle" class="h">Espiral</text><text x="1160" y="730" text-anchor="middle" class="b">temas retornam sob novas condições</text><text x="1160" y="763" text-anchor="middle" class="small">aprendizagem possível · percurso construído</text>
<g filter="url(#shadow)"><rect x="665" y="395" width="270" height="116" rx="58" fill="#F4EFEA"/><text x="800" y="440" text-anchor="middle" style="font:700 27px Arial;fill:#173F52">EIXO</text><text x="800" y="474" text-anchor="middle" style="font:400 19px Arial;fill:#375A61">reconhecer · retornar</text><text x="800" y="499" text-anchor="middle" style="font:400 19px Arial;fill:#375A61">diferenciar · orientar</text></g>
<text x="80" y="824" class="sub">O pêndulo mostra o movimento vivido; a espiral mostra o percurso construído.</text><text x="1450" y="824" text-anchor="end" class="small">Traduzindo o Ser Humano</text></svg>