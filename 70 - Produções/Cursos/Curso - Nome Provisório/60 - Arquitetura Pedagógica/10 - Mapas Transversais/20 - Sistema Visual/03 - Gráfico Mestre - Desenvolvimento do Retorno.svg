<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Mapa Desenvolvimento do Retorno</title><desc id="d">Percurso aberto em ondas com cinco movimentos: perceber, recuperar presença, diferenciar, orientar e aprender. Indicadores ao redor mostram tendências de desenvolvimento, sem formar escala diagnóstica.</desc>
<defs><style>
.title{font:700 48px Georgia,serif;fill:#F4EFEA}.sub{font:400 24px Arial,sans-serif;fill:#DDE7E3}
.h{font:700 27px Arial,sans-serif;fill:#F4EFEA}.b{font:400 22px Arial,sans-serif;fill:#F4EFEA}
.small{font:400 18px Arial,sans-serif;fill:#DDE7E3}.label{font:700 20px Arial,sans-serif;letter-spacing:2px;fill:#C9D8D1}
</style><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter></defs><rect width="1600" height="900" rx="28" fill="#173F52"/><rect x="42" y="42" width="1516" height="816" rx="24" fill="none" stroke="#7E9E84" stroke-width="2"/>
<text x="80" y="110" class="title">Desenvolvimento do Retorno</text><text x="80" y="150" class="sub">O que pode mudar concretamente com o treino?</text>
<path d="M140 560 C270 330 390 680 525 445 S780 300 905 515 S1160 665 1450 330" fill="none" stroke="#7E9E84" stroke-width="13" stroke-linecap="round"/>
<g fill="#F4EFEA" stroke="#C99A64" stroke-width="6" filter="url(#shadow)"><circle cx="205" cy="469" r="34"/><circle cx="477" cy="520" r="34"/><circle cx="755" cy="383" r="34"/><circle cx="1019" cy="586" r="34"/><circle cx="1330" cy="411" r="34"/></g>
<g class="h" text-anchor="middle"><text x="205" y="370">Perceber</text><text x="205" y="401" class="small">mais cedo</text><text x="477" y="625">Recuperar</text><text x="477" y="656" class="small">presença possível</text><text x="755" y="300">Diferenciar</text><text x="755" y="330" class="small">camadas da experiência</text><text x="1019" y="700">Orientar</text><text x="1019" y="731" class="small">resposta · apoio · limite</text><text x="1330" y="300">Aprender</text><text x="1330" y="331" class="small">efeitos · reparação</text></g>
<g><rect x="135" y="180" width="250" height="56" rx="28" fill="#245E78" stroke="#7E9E84"/><text x="260" y="216" text-anchor="middle" class="b">reconhecimento</text><rect x="405" y="180" width="250" height="56" rx="28" fill="#245E78" stroke="#7E9E84"/><text x="530" y="216" text-anchor="middle" class="b">intensidade</text><rect x="675" y="180" width="250" height="56" rx="28" fill="#245E78" stroke="#7E9E84"/><text x="800" y="216" text-anchor="middle" class="b">duração</text><rect x="945" y="180" width="250" height="56" rx="28" fill="#245E78" stroke="#7E9E84"/><text x="1070" y="216" text-anchor="middle" class="b">recursos</text><rect x="1215" y="180" width="250" height="56" rx="28" fill="#245E78" stroke="#7E9E84"/><text x="1340" y="216" text-anchor="middle" class="b">continuidade</text></g>
<text x="80" y="785" class="sub" style="font-size:20px">O retorno amplia a continuidade de uma vida progressivamente orientada pela Essência.</text><text x="80" y="818" class="small" style="font-size:16px">Indicadores formativos: tendências de mudança, não metas rígidas nem escala diagnóstica.</text><text x="1450" y="824" text-anchor="end" class="small">Traduzindo o Ser Humano</text></svg>