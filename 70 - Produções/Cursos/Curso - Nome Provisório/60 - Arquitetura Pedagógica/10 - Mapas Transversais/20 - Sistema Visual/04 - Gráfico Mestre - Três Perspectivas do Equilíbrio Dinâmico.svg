<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Mapa Três Perspectivas do Equilíbrio Dinâmico</title><desc id="d">Tríptico com yin-yang, neurobiologia autonômica e equilibração como lentes diferentes. Uma faixa inferior mostra a tradução autoral no curso sem equiparar as perspectivas.</desc>
