<text x="80" y="110" class="title">Três Perspectivas do Equilíbrio Dinâmico</text><text x="80" y="150" class="sub">Três lentes em diálogo — sem equivalência entre mecanismos ou estatutos</text>
<g filter="url(#shadow)"><rect x="90" y="215" width="440" height="420" rx="28" fill="#245E78"/><rect x="580" y="215" width="440" height="420" rx="28" fill="#245E78"/><rect x="1070" y="215" width="440" height="420" rx="28" fill="#245E78"/></g>
<text x="310" y="275" text-anchor="middle" class="h">Yin–yang</text><circle cx="310" cy="385" r="72" fill="#F4EFEA"/><path d="M310 313a72 72 0 0 1 0 144a36 36 0 0 0 0-72a36 36 0 0 1 0-72z" fill="#6E5C4D"/><circle cx="310" cy="349" r="9" fill="#F4EFEA"/><circle cx="310" cy="421" r="9" fill="#6E5C4D"/>
<text x="310" y="500" text-anchor="middle" class="b">alternância · relação</text><text x="310" y="535" text-anchor="middle" class="b">complementaridade · transformação</text><text x="310" y="590" text-anchor="middle" class="small">mapa tradicional e sistêmico</text>
<text x="800" y="275" text-anchor="middle" class="h">Neurobiologia autonômica</text><path d="M680 420 C720 330 780 330 800 420 C820 510 880 510 920 420" fill="none" stroke="#7E9E84" stroke-width="12" stroke-linecap="round"/><circle cx="680" cy="420" r="18" fill="#F4EFEA"/><circle cx="800" cy="420" r="18" fill="#C99A64"/><circle cx="920" cy="420" r="18" fill="#F4EFEA"/>
<text x="800" y="500" text-anchor="middle" class="b">conexão · mobilização</text><text x="800" y="535" text-anchor="middle" class="b">proteção · conservação · recuperação</text><text x="800" y="590" text-anchor="middle" class="small">mapa corporal e regulatório</text>
<text x="1290" y="275" text-anchor="middle" class="h">Equilibração</text><path d="M1170 455 L1255 365 L1330 445 L1410 330" fill="none" stroke="#7E9E84" stroke-width="10" stroke-linejoin="round"/><circle cx="1170" cy="455" r="16" fill="#F4EFEA"/><circle cx="1255" cy="365" r="16" fill="#C99A64"/><circle cx="1330" cy="445" r="16" fill="#F4EFEA"/><circle cx="1410" cy="330" r="16" fill="#C99A64"/>
<text x="1290" y="500" text-anchor="middle" class="b">perturbação · assimilação</text><text x="1290" y="535" text-anchor="middle" class="b">acomodação · reorganização</text><text x="1290" y="590" text-anchor="middle" class="small">mapa do desenvolvimento e aprendizagem</text>
<rect x="170" y="680" width="1260" height="90" rx="45" fill="#7E9E84"/><text x="800" y="718" text-anchor="middle" style="font:700 25px Arial;fill:#173F52">Tradução no curso</text><text x="800" y="751" text-anchor="middle" style="font:400 21px Arial;fill:#173F52">reconhecer · recuperar presença · diferenciar · orientar · aprender</text>
<text x="80" y="824" class="sub">Equilíbrio não é imobilidade: é capacidade de reorganização.</text><text x="1450" y="824" text-anchor="end" class="small">Traduzindo o Ser Humano</text></svg>